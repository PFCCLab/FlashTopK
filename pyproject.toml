[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashtopk"
version = "0.1.0"
description = "Fast, exact, deterministic fused top-k selection for learned sparse attention"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "triton>=3.3",
    "nvidia-cutlass-dsl>=4.5",
    "apache-tvm-ffi",
]

[project.optional-dependencies]
# FlashTopK also runs on PaddlePaddle tensors through `paddle.enable_compat(scope={"flashtopk"})`, so PyTorch is not a
# requirement of a plain install: paddlefleet_ops vendors this package into a Paddle environment that has no torch.
torch = ["torch>=2.6"]
test = ["pytest", "torch>=2.6"]

[tool.setuptools.packages.find]
include = ["flashtopk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
